<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
:root {
  --wood: #7a4a24; --wood-2: #5a3317; --wood-3: #3a1f0b;
  --parch: #f6ecd2; --parch-2: #eadbb5; --ink: #2d1e0f; --ink-2: #6e5a41; --line: #c9b388;
  --gold: #ffd54a; --btn: #83c83c; --btn-2: #4f8f1c; --btn-alt: #f5a524; --btn-alt-2: #b86b05;
  --sky-1: #5fb8f5; --sky-2: #cdeeff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: linear-gradient(var(--sky-1), var(--sky-2) 60%); font: 500 14px/1.4 Nunito, system-ui, sans-serif; color: var(--ink); }
#stage, #labels { position: fixed; inset: 0; }
#labels { pointer-events: none; }
.game { font-family: 'Lilita One', 'Nunito', sans-serif; font-weight: 400; letter-spacing: .02em; }
.outline { color: #fff; text-shadow: 0 2px 0 var(--wood-3), 2px 0 0 var(--wood-3), -2px 0 0 var(--wood-3), 0 -2px 0 var(--wood-3), 0 3px 4px rgba(0,0,0,.35); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* chunky beveled buttons */
.btn { font-family: 'Lilita One', sans-serif; font-size: 15px; color: #fff; border: 2px solid var(--wood-3); border-radius: 10px;
  padding: 5px 11px 7px; background: linear-gradient(#a5dc5a, var(--btn) 45%, var(--btn-2)); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 2px 0 var(--wood-3);
  text-shadow: 0 1px 0 var(--wood-3), 1px 0 0 var(--wood-3), -1px 0 0 var(--wood-3), 0 -1px 0 var(--wood-3); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.btn.alt { background: linear-gradient(#ffc94d, var(--btn-alt) 45%, var(--btn-alt-2)); }
.btn.off { background: linear-gradient(#cdbf9f, #a99672 50%, #7d6a48); }
.btn[aria-pressed="true"] { background: linear-gradient(#ffe27a, var(--gold) 45%, #d49b00); color: var(--wood-3); text-shadow: none; }

.panel { background: var(--parch); border: 3px solid var(--wood-3); border-radius: 14px; box-shadow: inset 0 0 0 3px var(--parch-2), 0 6px 0 rgba(58,31,11,.55), 0 10px 24px rgba(0,0,0,.25); }

/* top bar */
#top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
#top > * { pointer-events: auto; }
#title { padding: 8px 14px 10px; background: linear-gradient(#8a5a2e, var(--wood) 40%, var(--wood-2)); border: 3px solid var(--wood-3); border-radius: 14px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 5px 0 rgba(58,31,11,.6); }
#title h1 { margin: 0; font-size: 22px; line-height: 1.1; }
#clock { font-size: 28px; line-height: 1.1; margin-top: 2px; }
#clock small { font-size: 16px; opacity: .92; }
#counters { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.counter { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 4px; border-radius: 22px; border: 3px solid var(--wood-3);
  background: linear-gradient(#4a3a2a, #2a1d10); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.counter .ico { width: 34px; height: 34px; margin-left: -2px; display: grid; place-items: center; font-size: 19px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8, transparent 60%), var(--gold); border: 2px solid var(--wood-3); }
.counter b { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 20px; }
.counter span { font-size: 12px; opacity: .85; }

/* clan legend */
#legend { position: fixed; left: 12px; top: 112px; padding: 8px 10px; display: grid; gap: 3px; font-size: 13px; }
#legend h2, .panel h2 { margin: 0 0 4px; font: 400 15px 'Lilita One', sans-serif; color: var(--wood-2); }
#legend div { display: flex; align-items: center; gap: 7px; }
#legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--wood-3); }
#legend small { color: var(--ink-2); margin-left: auto; padding-left: 10px; }

/* chat feed */
#feed { position: fixed; left: 12px; bottom: 104px; width: min(380px, calc(100vw - 24px)); max-height: 30vh; overflow: hidden; padding: 8px 10px; display: flex; flex-direction: column; }
#feed ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
#feed li { font-size: 12.5px; line-height: 1.35; border-left: 4px solid; padding-left: 7px; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#feed li b { font-weight: 800; }
#feed li time { color: var(--ink-2); font-size: 11px; margin-right: 4px; }
#feed.collapsed ol { display: none; }
#feed header { display: flex; align-items: center; justify-content: space-between; }
#feed header button { border: 0; background: none; color: var(--wood-2); font-weight: 800; }

/* bottom bar */
#bottom { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
#scrub { flex: 1 1 320px; position: relative; height: 38px; display: flex; align-items: center; }
#scrub input { width: 100%; margin: 0; accent-color: var(--btn-alt); height: 38px; cursor: pointer; }
#ticks { position: absolute; left: 0; right: 0; top: -2px; height: 12px; pointer-events: none; font-size: 10px; color: var(--ink-2); }
#ticks span { position: absolute; transform: translateX(-2px); border-left: 2px solid var(--line); padding-left: 3px; white-space: nowrap; }
.group { display: flex; gap: 6px; align-items: center; }
.group label { font: 400 13px 'Lilita One', sans-serif; color: var(--wood-2); }
select { font: 700 13px Nunito, sans-serif; border: 2px solid var(--wood-3); border-radius: 8px; background: #fff8e6; padding: 5px 6px; color: var(--ink); }

/* agent drawer */
#drawer { position: fixed; top: 12px; right: 12px; bottom: 104px; width: min(400px, calc(100vw - 24px)); display: none; flex-direction: column; overflow: hidden; }
#drawer.open { display: flex; }
#drawer .head { padding: 12px 14px 10px; color: #fff; border-bottom: 3px solid var(--wood-3); position: relative; }
#drawer .head h2 { color: #fff; font-size: 24px; margin: 0; }
#drawer .head p { margin: 2px 0 0; font-size: 12.5px; opacity: .95; }
#drawer .close { position: absolute; top: 8px; right: 8px; padding: 1px 10px 4px; }
#drawer .body { overflow-y: auto; padding: 10px 14px 16px; display: grid; gap: 14px; }
.goal { background: #fff8e6; border: 2px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.goal b { font-family: 'Lilita One', sans-serif; font-weight: 400; color: var(--wood-2); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tile { background: #fff8e6; border: 2px solid var(--line); border-radius: 10px; padding: 5px 6px; text-align: center; }
.tile b { display: block; font: 400 19px 'Lilita One', sans-serif; color: var(--ink); }
.tile span { font-size: 11px; color: var(--ink-2); line-height: 1.15; display: block; }
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 116px 1fr 44px; align-items: center; gap: 8px; font-size: 12.5px; }
.bar .track { height: 12px; background: #eadbb5; border-radius: 6px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--wood); border-radius: 0 4px 4px 0; }
.bar .pct { text-align: right; font-weight: 800; }
.now { background: #fff8e6; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; display: grid; gap: 4px; }
.now code { font: 12px ui-monospace, monospace; background: #2d1e0f; color: #e7f7c9; padding: 4px 6px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; display: block; }
.partners { display: grid; gap: 4px; }
.partner { display: flex; align-items: center; gap: 8px; border: 0; background: #fff8e6; border-radius: 8px; padding: 4px 8px; text-align: left; color: var(--ink); font-size: 13px; }
.partner:hover { background: #fff; }
.partner i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.partner small { margin-left: auto; color: var(--ink-2); white-space: nowrap; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { font-size: 12.5px; border-left: 3px solid var(--line); padding: 2px 0 2px 8px; white-space: pre-wrap; word-break: break-word; }
.list li.cur { border-color: var(--btn-alt); background: #fff3d0; }
.list time { display: block; color: var(--ink-2); font-size: 11px; font-weight: 800; }
details summary { cursor: pointer; font: 400 15px 'Lilita One', sans-serif; color: var(--wood-2); }

/* 3D labels */
.tag { font: 400 12px 'Lilita One', sans-serif; color: #fff; padding: 1px 6px 2px; border-radius: 7px; border: 2px solid var(--wood-3);
  white-space: nowrap; pointer-events: auto; cursor: pointer; transform: translateY(-4px); text-shadow: 0 1px 0 rgba(0,0,0,.5); }
.tag.dim { opacity: .35; }
.bubble { max-width: 220px; font: 600 11.5px/1.3 Nunito, sans-serif; color: var(--ink); background: #fff; border: 2px solid var(--wood-3); border-radius: 10px;
  padding: 5px 8px; box-shadow: 0 3px 0 rgba(0,0,0,.25); transform: translateY(-28px); pointer-events: auto; cursor: pointer; animation: pop .18s ease-out; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; border: 7px solid transparent; border-top-color: var(--wood-3); border-bottom: 0; transform: translateX(-50%); }
@keyframes pop { from { transform: translateY(-20px) scale(.7); opacity: 0; } }
.col-label { font: 400 11px/1.1 'Lilita One', sans-serif; color: #fff; text-align: center; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; pointer-events: none; }
.col-label small { display: block; font-size: 10px; opacity: .9; }
.sign { font: 400 15px 'Lilita One', sans-serif; color: #fff; padding: 2px 10px 4px; border-radius: 9px; border: 3px solid var(--wood-3);
  background: linear-gradient(#8a5a2e, var(--wood-2)); box-shadow: 0 3px 0 rgba(0,0,0,.35); white-space: nowrap; pointer-events: auto; cursor: pointer; }
.sign b { font-weight: 400; color: var(--gold); margin-left: 6px; }
#tip { position: fixed; pointer-events: none; display: none; padding: 6px 9px; font-size: 12.5px; z-index: 5; }
#cross { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; display: none; }
#cross::before, #cross::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px #0008; }
#cross::before { left: 8px; top: 0; width: 2px; height: 18px; } #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
#walkhelp { position: fixed; top: 50%; left: 50%; transform: translate(-50%, 70px); display: none; padding: 6px 12px; font-size: 13px; }

/* loading */
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #8fd0ff, #2f86c9); z-index: 10; }
#loading .card { width: min(440px, 90vw); padding: 22px; text-align: center; }
#loading h1 { font: 400 34px 'Lilita One', sans-serif; margin: 0 0 12px; }
#loadbar { height: 22px; border: 3px solid var(--wood-3); border-radius: 12px; background: #3a2a1a; overflow: hidden; }
#loadbar i { display: block; height: 100%; width: 0; background: linear-gradient(#b8f06a, #6aae2a); transition: width .2s; }
#loading p { margin: 10px 0 0; color: var(--ink-2); }
#loading pre { text-align: left; background: #2d1e0f; color: #e7f7c9; padding: 10px; border-radius: 8px; white-space: pre-wrap; }

@media (max-width: 760px) {
  #legend, #feed { display: none; }
  #counters .counter span { display: none; }
  #title h1 { font-size: 16px; } #clock { font-size: 20px; }
  #ticks small { display: none; }
  #drawer { bottom: 12px; top: auto; height: 70vh; }
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>
<div id="cross"></div>
<div id="walkhelp" class="panel">WASD to walk · Shift to run · click an agent · Esc to leave</div>

<header id="top">
  <div id="title">
    <h1 class="game outline">AI Village · <span id="range"></span></h1>
    <div id="clock" class="game outline"></div>
  </div>
  <div id="counters"></div>
</header>

<aside id="legend" class="panel" aria-label="Clans"><h2>Clans</h2></aside>

<section id="feed" class="panel" aria-label="Village chat">
  <header><h2>Village chat</h2><button id="feedToggle" aria-expanded="true">hide</button></header>
  <ol id="feedList"></ol>
</section>

<nav id="bottom" class="panel" aria-label="Replay controls">
  <button id="play" class="btn alt" aria-label="Play or pause (space)">▶ Play</button>
  <div class="group" role="group" aria-label="Replay speed">
    <label for="speed">Speed</label>
    <select id="speed">
      <option value="60">1 min/s</option>
      <option value="300" selected>5 min/s</option>
      <option value="900">15 min/s</option>
      <option value="3600">1 h/s</option>
    </select>
  </div>
  <div id="scrub"><div id="ticks"></div><input id="time" type="range" min="0" step="60" aria-label="Village time"></div>
  <div class="group" role="group" aria-label="Mentions">
    <label for="beams">Mentions</label>
    <select id="beams"><option value="0">Off</option><option value="1" selected>Last hour</option><option value="2">Whole week</option></select>
  </div>
  <div class="group" role="group" aria-label="Stats plaza">
    <label for="metric">Plaza</label>
    <select id="metric"></select>
  </div>
  <button id="plazaBtn" class="btn off">🧱 Plaza</button>
  <button id="names" class="btn" aria-pressed="true">Names</button>
  <button id="walk" class="btn">🚶 Walk</button>
</nav>

<aside id="drawer" class="panel" aria-label="Agent details"></aside>
<div id="tip" class="panel"></div>

<div id="loading"><div class="card panel">
  <h1 class="game outline">AI Village</h1>
  <div id="loadbar"><i></i></div>
  <p id="loadmsg">Loading the village…</p>
</div></div>

<script type="module" src="main.js"></script>
</body>
</html>
