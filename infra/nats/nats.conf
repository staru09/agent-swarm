server_name: swarmguard
port: 4222
http_port: 8222
jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 256MB
  max_file_store: 2GB
}

authorization {
  users: [
    {
      user: "researcher"
      password: "researcher-dev"
      permissions: {
        publish: ["swarm.*.agent.researcher.>"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.researcher"]
      }
    }
    {
      user: "analyst"
      password: "analyst-dev"
      permissions: {
        publish: ["swarm.*.agent.analyst.>"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.analyst"]
      }
    }
    {
      user: "operator"
      password: "operator-dev"
      permissions: {
        publish: ["swarm.*.agent.operator.>"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.operator"]
      }
    }
    {
      user: "gateway"
      password: "gateway-dev"
      permissions: {
        publish: ["audit.>", "private.tool.>", "_INBOX.>"]
        subscribe: ["swarm.*.agent.*.tool.request", "swarm.*.agent.*.message.*", "_INBOX.>"]
      }
    }
    {
      user: "tools"
      password: "tools-dev"
      permissions: {
        publish: ["audit.>", "_INBOX.>"]
        subscribe: ["private.tool.>"]
      }
    }
    {
      user: "telemetry"
      password: "telemetry-dev"
      permissions: {
        publish: ["audit.>"]
      }
    }
    { user: "timeline", password: "timeline-dev" }
  ]
}
