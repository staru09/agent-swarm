# SwarmGuard production NATS server configuration TEMPLATE.
#
# This template hardens the demo topology for a real deployment:
#   * TLS is mandatory with mutual verification of client certificates.
#   * Identities are keyed by NKey public keys, NOT checked-in dev passwords.
#     Generate a per-identity NKey seed with `nk -gen user -pubout` and issue
#     matching `.creds` files; never commit seeds.
#   * Each identity keeps the least-privilege subject scope from the demo, plus
#     a dedicated `timeline` identity that can only consume/bind the audit live
#     feed and can NEVER publish to the private tool workers.
#
# Replace every REPLACE_WITH_* placeholder before deploying. Bind 4222/8222 to
# private interfaces only and expose nothing publicly.

server_name: swarmguard
listen: 0.0.0.0:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 512MB
  max_file_store: 5GB
}
max_payload: 2MB

tls {
  cert_file: "/etc/swarmguard/tls/server-cert.pem"
  key_file: "/etc/swarmguard/tls/server-key.pem"
  ca_file: "/etc/swarmguard/tls/ca.pem"
  verify: true
  timeout: 5
}

authorization {
  users: [
    {
      # identity: researcher
      nkey: "REPLACE_WITH_RESEARCHER_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.researcher.tool.request", "swarm.*.agent.researcher.message.*", "swarm.*.agent.researcher.lifecycle"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.researcher"]
      }
    }
    {
      # identity: analyst
      nkey: "REPLACE_WITH_ANALYST_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.analyst.tool.request", "swarm.*.agent.analyst.message.*", "swarm.*.agent.analyst.lifecycle"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.analyst"]
      }
    }
    {
      # identity: operator
      nkey: "REPLACE_WITH_OPERATOR_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.operator.tool.request", "swarm.*.agent.operator.message.*", "swarm.*.agent.operator.lifecycle"]
        subscribe: ["_INBOX.>", "swarm.*.agent.*.message.operator"]
      }
    }
    {
      # identity: web-researcher
      nkey: "REPLACE_WITH_WEB_RESEARCHER_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.web-researcher.tool.request", "swarm.*.agent.web-researcher.lifecycle"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: paper-reviewer
      nkey: "REPLACE_WITH_PAPER_REVIEWER_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.paper-reviewer.tool.request", "swarm.*.agent.paper-reviewer.lifecycle"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: summary-writer
      nkey: "REPLACE_WITH_SUMMARY_WRITER_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.summary-writer.tool.request", "swarm.*.agent.summary-writer.lifecycle"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: hypothesis-generator
      nkey: "REPLACE_WITH_HYPOTHESIS_GENERATOR_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.hypothesis-generator.tool.request", "swarm.*.agent.hypothesis-generator.lifecycle"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: research-orchestrator
      nkey: "REPLACE_WITH_RESEARCH_ORCHESTRATOR_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["swarm.*.agent.research-orchestrator.lifecycle"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: gateway
      nkey: "REPLACE_WITH_GATEWAY_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["audit.>", "commands.>", "retry.>", "deadletter.>", "private.tool.>", "private.tool_call.*.*.cancel", "_INBOX.>"]
        subscribe: ["swarm.*.agent.*.tool.request", "swarm.*.agent.*.message.*", "swarm.*.agent.*.lifecycle", "_INBOX.>"]
      }
    }
    {
      # identity: tools
      nkey: "REPLACE_WITH_TOOLS_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["audit.>", "deadletter.>", "_INBOX.>"]
        subscribe: ["private.tool.>", "private.tool_call.*.*.cancel"]
      }
    }
    {
      # identity: telemetry
      nkey: "REPLACE_WITH_TELEMETRY_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["audit.>"]
      }
    }
    {
      # identity: stream-bootstrap
      nkey: "REPLACE_WITH_STREAM_BOOTSTRAP_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["$JS.API.STREAM.CREATE.SWARMGUARD_AUDIT", "$JS.API.STREAM.CREATE.SWARMGUARD_COMMANDS", "$JS.API.STREAM.CREATE.SWARMGUARD_RETRY", "$JS.API.STREAM.CREATE.SWARMGUARD_DEAD_LETTER", "$JS.API.STREAM.UPDATE.*", "$JS.API.STREAM.INFO.*", "$JS.API.CONSUMER.DURABLE.CREATE.SWARMGUARD_AUDIT.swarmguard-projector-v1", "$JS.API.CONSUMER.INFO.SWARMGUARD_AUDIT.swarmguard-projector-v1"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # identity: projector
      nkey: "REPLACE_WITH_PROJECTOR_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["$JS.API.CONSUMER.INFO.SWARMGUARD_AUDIT.swarmguard-projector-v1", "$JS.API.CONSUMER.MSG.NEXT.SWARMGUARD_AUDIT.swarmguard-projector-v1", "$JS.ACK.>", "deadletter.audit.projector"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      # Dedicated least-privilege identity for the FastAPI/React timeline.
      # It may create/bind an ephemeral ordered consumer on the audit stream and
      # receive the live audit feed, and NOTHING else. It cannot publish to
      # private.tool.> (tool workers) or to any agent/audit subject.
      # identity: timeline
      nkey: "REPLACE_WITH_TIMELINE_NKEY_PUBLIC_KEY"
      permissions: {
        publish: ["$JS.API.STREAM.INFO.SWARMGUARD_AUDIT", "$JS.API.CONSUMER.CREATE.SWARMGUARD_AUDIT", "$JS.API.CONSUMER.CREATE.SWARMGUARD_AUDIT.>", "$JS.API.CONSUMER.INFO.SWARMGUARD_AUDIT.>", "$JS.API.CONSUMER.MSG.NEXT.SWARMGUARD_AUDIT.>", "$JS.ACK.>", "_INBOX.>"]
        subscribe: ["_INBOX.>", "audit.>"]
      }
    }
  ]
}
