name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - name: Unit, schema-compatibility and contract tests
        run: uv run pytest -q
      - name: Dependency scan
        run: uv export --frozen --no-hashes --no-emit-project > requirements.txt && uvx pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency scan
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - name: Start infrastructure (NATS, Postgres, migrations, projector, API)
        run: docker compose up -d --build --wait
      - name: Migrations are idempotent
        run: docker compose run --rm migrate
      - name: Gateway decoy/ACL probe through JetStream into Postgres
        env:
          DATABASE_URL: postgresql://swarmguard:swarmguard-dev@127.0.0.1:5432/swarmguard
        run: uv run python tests/integration_research.py --start-gateway
      - if: failure()
        run: docker compose logs

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swarmguard:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: swarmguard:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
