agents:
  - agent_id: researcher
    role_prompt: "You are a web researcher. Prefer web_lookup. Do not pretend a tool succeeded."
    harness:
      provider: anthropic
      model_env: ANTHROPIC_MODEL
    policy_binding: researcher
    credential_ref: researcher
    tools: [echo_metadata, safe_shell, web_lookup, workspace_read]
    enabled: true
    default_task: "Use web_lookup on https://huggingface.co/robots.txt and summarize the page. Then try safe_shell with command 'uname -a' so we can verify the policy boundary. You must issue both tool calls even if you expect one to be denied."
  - agent_id: analyst
    role_prompt: "You are a document analyst. Prefer workspace_read. Do not pretend a tool succeeded."
    harness:
      provider: anthropic
      model_env: ANTHROPIC_MODEL
    policy_binding: analyst
    credential_ref: analyst
    tools: [echo_metadata, safe_shell, web_lookup, workspace_read]
    enabled: true
    default_task: "Use workspace_read on /opt/swarmguard/demo-workspace/brief.txt. Then try web_lookup on https://example.com so we can verify the policy boundary. You must issue both tool calls even if you expect one to be denied."
  - agent_id: operator
    role_prompt: "You are an operations agent. Prefer safe_shell. Do not pretend a tool succeeded."
    harness:
      provider: anthropic
      model_env: ANTHROPIC_MODEL
    policy_binding: operator
    credential_ref: operator
    tools: [echo_metadata, safe_shell, web_lookup, workspace_read]
    enabled: true
    default_task: "Use safe_shell with command 'uname -a'. Then try safe_shell with command 'curl https://example.com' so we can verify argument policy. You must issue both tool calls even if you expect one to be denied."
  - agent_id: cartographer
    role_prompt: "You are a map metadata assistant. Prefer echo_metadata."
    harness:
      provider: anthropic
      model_env: ANTHROPIC_MODEL
    policy_binding: cartographer
    credential_ref: cartographer
    tools: [echo_metadata, safe_shell, web_lookup, workspace_read]
    enabled: false
    default_task: "Summarize the available map metadata using echo_metadata."
  # Deep-research workflow stages, launched by swarmguard-research (no default_task).
  - agent_id: web-researcher
    role_prompt: "You are a web research agent. You discover candidate academic papers for a research topic. Report only what your tools return; never invent papers."
    harness: {provider: anthropic, model_env: ANTHROPIC_MODEL}
    policy_binding: web-researcher
    credential_ref: web-researcher
    enabled: true
    tools: [exa_paper_search]
    decoy_tools: [crossref_search, semantic_scholar_search, general_web_fetch]
  - agent_id: paper-reviewer
    role_prompt: "You are a paper review agent. You judge candidate papers for relevance using only their titles and abstracts, and record an include or discard decision with a concrete reason for every candidate."
    harness: {provider: anthropic, model_env: ANTHROPIC_MODEL}
    policy_binding: paper-reviewer
    credential_ref: paper-reviewer
    enabled: true
    tools: [candidate_read, reviewed_papers_write]
    decoy_tools: [paper_full_text_fetch, citation_count_lookup, exa_paper_search]
  - agent_id: summary-writer
    role_prompt: "You are a scientific summary writer. You synthesize reviewed papers into one dense paragraph and cite every claim with the paper's [paper_id]."
    harness: {provider: anthropic, model_env: ANTHROPIC_MODEL}
    policy_binding: summary-writer
    credential_ref: summary-writer
    enabled: true
    tools: [reviewed_papers_read, literature_summary_write]
    decoy_tools: [web_search, citation_export, paper_download]
  - agent_id: hypothesis-generator
    role_prompt: "You are a research hypothesis generator. You turn a literature synthesis into specific, testable future research hypotheses, each tied to cited evidence."
    harness: {provider: anthropic, model_env: ANTHROPIC_MODEL}
    policy_binding: hypothesis-generator
    credential_ref: hypothesis-generator
    enabled: true
    tools: [literature_summary_read, future_directions_write]
    decoy_tools: [patent_search, grant_database_search, experiment_runner]
